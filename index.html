<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minecraft 書本分頁器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAE6DA; --panel:#F6F2E7; --ink:#2B2117; --muted:#6E6455;
  --line:#BFB49C; --page:#F1E4C3; --page-ink:#3A2A14; --accent:#B0507E; --accent-ink:#FFFFFF; --done:#5E8A4E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161C29; --panel:#1F2738; --ink:#E7E2D6; --muted:#9AA1B2;
    --line:#38425A; --page:#EADBB8; --page-ink:#3A2A14; --accent:#E39BBD; --accent-ink:#1A1420; --done:#8DBF7A;
  }
}
:root[data-theme="dark"]{
  --bg:#161C29; --panel:#1F2738; --ink:#E7E2D6; --muted:#9AA1B2;
  --line:#38425A; --page:#EADBB8; --page-ink:#3A2A14; --accent:#E39BBD; --accent-ink:#1A1420; --done:#8DBF7A;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:.04em}
.lede{color:var(--muted);margin:0 0 24px;max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
textarea{width:100%;min-height:340px;resize:vertical;padding:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:1rem;border-radius:4px}
textarea:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.settings{display:flex;flex-wrap:wrap;gap:14px 22px;margin:14px 0 6px;font-size:.95rem}
.settings label{display:flex;align-items:center;gap:8px}
.settings input[type=number]{width:4.2em;padding:4px 6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;border-radius:4px}
.settings select{padding:4px 6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;border-radius:4px}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.stat{color:var(--muted);font-size:.95rem}
button{font:inherit;cursor:pointer;border-radius:4px}
.next{background:var(--accent);color:var(--accent-ink);border:none;padding:12px 20px;font-weight:700;font-size:1.05rem}
.next:disabled{opacity:.45;cursor:default}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);padding:8px 14px}
.book-label{margin:22px 0 10px;font-weight:700;color:var(--muted);font-size:.95rem}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.page{position:relative;background:var(--page);color:var(--page-ink);padding:14px 14px 12px;border:3px solid #6B4A26;box-shadow:inset 0 0 0 3px #D9C59A;image-rendering:pixelated}
.page.done{opacity:.55}
.page.current{outline:3px solid var(--accent);outline-offset:3px}
.page-head{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;margin-bottom:8px;color:#7A5A30}
.page pre{margin:0;font-family:"DotGothic16","Noto Sans TC",monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-all;min-height:calc(1.5em * 14)}
.page button{background:#6B4A26;color:#F1E4C3;border:none;padding:4px 10px;font-size:.8rem}
.page.done button{background:var(--done);color:#fff}
.empty{border:2px dashed var(--line);padding:40px 20px;text-align:center;color:var(--muted);border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Minecraft 書本分頁器</h1>
  <p class="lede">把一大段文字貼進來，自動切成書與羽毛筆一頁放得下的大小。在遊戲裡翻到新的一頁，回來按「複製下一頁」，再貼上，重複到完成。</p>

  <div class="grid">
    <section>
      <textarea id="src" placeholder="在這裡貼上你的文字。換行和空白行都會保留。"></textarea>
      <div class="settings">
        <label>每行中文字數 <input type="number" id="cpl" min="6" max="20" value="12"></label>
        <label>每頁行數 <input type="number" id="lpp" min="4" max="14" value="14"></label>
        <label>版本
          <select id="ver">
            <option value="100">Java 版（每本 100 頁）</option>
            <option value="50">基岩版（每本 50 頁）</option>
          </select>
        </label>
      </div>
      <p class="hint">貼上後如果某頁最後一行被切掉，把「每頁行數」調小 1，或「每行中文字數」調小 1。英文和數字會依實際寬度換算，比中文字窄。</p>
    </section>

    <section>
      <div class="bar">
        <button class="next" id="next" disabled>複製下一頁</button>
        <button class="ghost" id="reset">從頭開始</button>
        <span class="stat" id="stat"></span>
      </div>
      <div id="out"><div class="empty">貼上文字後，分好的頁面會出現在這裡。</div></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const src=$("src"),cpl=$("cpl"),lpp=$("lpp"),ver=$("ver"),out=$("out"),nextBtn=$("next"),stat=$("stat"),toast=$("toast");
  let pages=[],cursor=0,done=new Set();

  // 寬度以「中文字 = 9px」為 1 單位，依 Minecraft 預設字型估算
  function cw(ch){
    if(ch===" ") return 4/9;
    if(".,:;!|i'`".includes(ch)) return 2/9;
    if(ch==="l") return 3/9;
    if("tI[]".includes(ch)) return 4/9;
    if("fk<>(){}\"*".includes(ch)) return 5/9;
    const c=ch.codePointAt(0);
    if(c<0x7F) return 6/9;
    return 1;
  }
  function chunks(par){
    const out=[];let buf="";
    for(const ch of par){
      const c=ch.codePointAt(0);
      if(ch===" "){ if(buf){out.push(buf);buf="";} out.push(" "); }
      else if(c<0x7F){ buf+=ch; }
      else { if(buf){out.push(buf);buf="";} out.push(ch); }
    }
    if(buf) out.push(buf);
    return out;
  }
  const wOf=s=>[...s].reduce((a,ch)=>a+cw(ch),0);

  // 回傳行陣列：{text, hard}，hard 表示此行後原本有換行
  function wrap(text,limit){
    const lines=[];
    const pars=text.replace(/\r\n?/g,"\n").split("\n");
    pars.forEach((par,pi)=>{
      const isLast=pi===pars.length-1;
      if(par===""){ lines.push({text:"",hard:!isLast}); return; }
      let line="",w=0;
      const push=()=>{lines.push({text:line,hard:false});line="";w=0;};
      for(const ck of chunks(par)){
        const cwid=wOf(ck);
        if(w+cwid<=limit+1e-9){ line+=ck; w+=cwid; continue; }
        if(ck===" "){ line+=" "; push(); continue; }
        if(cwid>limit){
          for(const ch of ck){ const x=cw(ch); if(w+x>limit+1e-9) push(); line+=ch; w+=x; }
          continue;
        }
        push(); line=ck; w=cwid;
      }
      lines.push({text:line,hard:!isLast});
    });
    return lines;
  }

  function paginate(){
    const text=src.value;
    const limit=Math.max(6,Math.min(20,+cpl.value||12));
    const per=Math.max(4,Math.min(14,+lpp.value||14));
    try{localStorage.setItem("mcbook-draft",text);}catch(e){}
    if(!text.trim()){ pages=[]; render(); return; }
    const lines=wrap(text,limit);
    pages=[];
    for(let i=0;i<lines.length;i+=per){
      const slice=lines.slice(i,i+per);
      let s="";
      slice.forEach((ln,j)=>{ s+=ln.text; if(ln.hard && j<slice.length-1) s+="\n"; });
      // 頁首的空行在遊戲中無意義，但保留以維持原排版
      pages.push(s);
    }
    while(pages.length && pages[pages.length-1].trim()==="") pages.pop();
    cursor=0; done=new Set(); render();
  }

  function render(){
    if(!pages.length){
      out.innerHTML='<div class="empty">貼上文字後，分好的頁面會出現在這裡。</div>';
      nextBtn.disabled=true; stat.textContent=""; return;
    }
    const perBook=+ver.value;
    const books=Math.ceil(pages.length/perBook);
    stat.textContent=`共 ${pages.length} 頁`+(books>1?`，需要 ${books} 本書`:"")+`｜已複製 ${done.size} 頁`;
    nextBtn.disabled=cursor>=pages.length;
    nextBtn.textContent=cursor>=pages.length?"全部複製完成":`複製第 ${cursor+1} 頁`;
    const frag=document.createDocumentFragment();
    let grid=null;
    pages.forEach((p,i)=>{
      if(i%perBook===0){
        if(books>1){ const h=document.createElement("div"); h.className="book-label"; h.textContent=`第 ${i/perBook+1} 本書`; frag.appendChild(h); }
        grid=document.createElement("div"); grid.className="pages"; frag.appendChild(grid);
      }
      const card=document.createElement("article");
      card.className="page"+(done.has(i)?" done":"")+(i===cursor?" current":"");
      const head=document.createElement("div"); head.className="page-head";
      const lab=document.createElement("span"); lab.textContent=`第 ${i%perBook+1} 頁`;
      const b=document.createElement("button"); b.textContent=done.has(i)?"已複製":"複製";
      b.addEventListener("click",()=>copyPage(i));
      head.append(lab,b);
      const pre=document.createElement("pre"); pre.textContent=p;
      card.append(head,pre); grid.appendChild(card);
    });
    out.replaceChildren(frag);
    const cur=out.querySelector(".current");
    if(cur && document.activeElement===nextBtn) cur.scrollIntoView({block:"nearest"});
  }

  async function copyText(t){
    try{ await navigator.clipboard.writeText(t); return true; }
    catch(e){
      const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      let ok=false; try{ok=document.execCommand("copy");}catch(_){}
      ta.remove(); return ok;
    }
  }
  async function copyPage(i){
    const ok=await copyText(pages[i]);
    if(!ok){ show("複製失敗，請手動選取文字複製"); return; }
    done.add(i); cursor=Math.max(cursor,i+1);
    const perBook=+ver.value;
    show(`已複製第 ${i%perBook+1} 頁`+(pages.length>perBook?`（第 ${Math.floor(i/perBook)+1} 本書）`:""));
    render();
  }
  let tt;
  function show(m){ toast.textContent=m; toast.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>toast.classList.remove("show"),1600); }

  nextBtn.addEventListener("click",()=>{ if(cursor<pages.length) copyPage(cursor); });
  $("reset").addEventListener("click",()=>{ cursor=0; done=new Set(); render(); });
  let deb; src.addEventListener("input",()=>{ clearTimeout(deb); deb=setTimeout(paginate,250); });
  [cpl,lpp].forEach(el=>el.addEventListener("change",paginate));
  ver.addEventListener("change",render);

  try{ const d=localStorage.getItem("mcbook-draft"); if(d){ src.value=d; } }catch(e){}
  paginate();
})();
</script>
</body>
</html>
